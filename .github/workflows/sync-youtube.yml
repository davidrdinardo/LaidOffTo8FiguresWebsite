name: Sync YouTube episodes
run-name: "Diagnostic (scratch branch, read-only): YouTube uploads report"

# SCRATCH BRANCH ONLY. Temporary variant of the sync workflow that runs a
# read-only diagnostic with the YouTube API key and commits its report to this
# branch. It never runs the sync and never touches the site branch.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-youtube-diagnostic
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == 'claude/busy-wozniak-rk77pi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read-only YouTube diagnostic
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/diagnose-youtube.mjs

      - name: Commit the report to this scratch branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diagnostics
          if git diff --cached --quiet; then
            echo "No report to commit."
          else
            git commit -m "diag: YouTube uploads report (scratch branch only)"
            git push
          fi
