name: Sync YouTube episodes

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {} # manual "Run workflow" button
  push:
    branches: [claude/laidoffto8figures-website-u7z4sl]
    paths:
      - "scripts/sync-youtube.mjs"
      - "youtube.config.json"
      - ".github/workflows/sync-youtube.yml"

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync episodes from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-youtube.mjs

      - name: Commit updated files if they changed
        run: |
          if [[ -n "$(git status --porcelain episodes.json index.html sitemap.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add episodes.json index.html sitemap.xml
            git commit -m "chore: sync episodes from YouTube"
            git push
          else
            echo "No changes to sync."
          fi
